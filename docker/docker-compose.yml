version: '3.8'

services:
  sanctuary-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: acel-haikal-sanctuary
    restart: unless-stopped
    ports:
      - "23625:23625"
    environment:
      - PORT=23625
      - NODE_ENV=production
      - ACTIVE_DOMAIN=acellimut.my.id
      - WEBHOOK_SECRET=couple_secret_token_123
    volumes:
      - sanctuary_data:/app/backend/data

volumes:
  sanctuary_data:
