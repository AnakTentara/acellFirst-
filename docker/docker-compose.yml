services:
  sanctuary-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: acell-haikal-sanctuary
    restart: unless-stopped
    ports:
      - "23625:23625"
    environment:
      - PORT=23625
      - NODE_ENV=production
      - ACTIVE_DOMAIN=acellimut.my.id
      # Secrets are NOT written here. This file is committed, so anything in
      # it is public. The backend generates a random JWT/webhook secret on
      # first boot and keeps it in the data volume (backend/data/.secrets.json).
      # To pin your own, put them in docker/.env (gitignored) instead:
      #   JWT_SECRET=...
      #   WEBHOOK_SECRET=...
      #   COURIER_API_KEY=...
    env_file:
      - path: .env
        required: false
    volumes:
      - sanctuary_data:/app/backend/data

volumes:
  sanctuary_data:
